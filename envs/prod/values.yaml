# Default values for application.
# Production environment values for Artemis.

replicaCount: 2

# Prometheus scraping
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "5000"
  prometheus.io/path: "/metrics"

# Artemis container image
image:
  repository: "us-central1-docker.pkg.dev/feisty-tempo-504623-a5/artemis/artemis"
  pullPolicy: IfNotPresent
  tag: "12.0.0"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Service Account
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Pod labels
podLabels: {}

# Security contexts
podSecurityContext: {}

securityContext: {}

# Kubernetes Service
service:
  type: ClusterIP
  port: 5000

# Production Ingress
ingress:
  enabled: true
  className: "nginx"

  annotations:
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

  hosts:
    - host: "prod-internal-artemis.dianaasww.com"
      paths:
        - path: /
          pathType: Prefix

  tls:
    - secretName: prod-artemis-tls
      hosts:
        - "prod-internal-artemis.dianaasww.com"

  extraPaths: []

# Gateway API HTTPRoute
httpRoute:
  enabled: false

  annotations: {}

  parentRefs:
    - name: gateway
      sectionName: http

  hostnames:
    - chart-example.local

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers

# Resource requests and limits
resources: {}

# Probes disabled for now
# livenessProbe:
#   httpGet:
#     path: /
#     port: http
#
# readinessProbe:
#   httpGet:
#     path: /
#     port: http

# Horizontal Pod Autoscaling
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes
volumes: []

# Additional volume mounts
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
